<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: #16213e;
            border-radius: 24px;
            padding: 48px 64px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .bulb {
            font-size: 80px;
            margin-bottom: 16px;
            transition: filter 0.3s;
        }

        .bulb.on {
            filter: drop-shadow(0 0 20px #ffd700);
        }

        h1 {
            color: #e0e0e0;
            font-size: 1.6rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-on {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            box-shadow: 0 4px 20px rgba(255, 210, 0, 0.4);
        }

        .btn-on:hover {
            box-shadow: 0 4px 28px rgba(255, 210, 0, 0.7);
        }

        .btn-off {
            background: linear-gradient(135deg, #373b44, #4286f4);
            color: #e0e0e0;
            box-shadow: 0 4px 20px rgba(66, 134, 244, 0.3);
        }

        .btn-off:hover {
            box-shadow: 0 4px 28px rgba(66, 134, 244, 0.6);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="bulb" id="bulb">💡</div>
        <h1>LED CONTROL</h1>
        <div class="buttons">
            <form method="GET" action="/" style="display:inline">
                <button class="btn btn-on" type="submit" name="led" value="On">켜기</button>
            </form>
            <form method="GET" action="/" style="display:inline">
                <button class="btn btn-off" type="submit" name="led" value="Off">끄기</button>
            </form>
        </div>
    </div>
</body>
</html>
